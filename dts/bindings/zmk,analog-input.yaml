description: |
  Input driver for ADC io channel

compatible: "zmk,analog-input"

properties:
  sampling-hz:
    type: int
    default: 100

child-binding:
  description: Per-channel configuration settings
  properties:
    io-channels:
      type: phandle-array
      required: true
    mv-mid:
      type: int
      required: true
    mv-min-max:
      type: int
      required: true
    mv-deadzone:
      type: int
      default: 10
    invert:
      type: boolean
    report-on-change-only:
      type: boolean
    report-threshold:
      type: int
      default: 0
      description: |
        With report-on-change-only, suppress a report unless the (scaled) value
        differs from the last reported value by at least this many units. 0 keeps
        the original "report on any change" behaviour. A small threshold lets a
        noisy analog source (e.g. a slide pot) sit quiet at rest so the device can
        idle into deep sleep, while still reporting real movement.
    scale-multiplier:
      type: int
      default: 1
    scale-divisor:
      type: int
      default: 70
    evt-type:
      type: int
      required: true
    input-code:
      type: int
      required: true
